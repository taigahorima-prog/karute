<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>病傷カルテ入力</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#253447;margin:0}main{max-width:860px;margin:auto;padding:16px}header{background:#173d58;color:white;padding:17px}h1{font-size:20px;margin:0}.panel{background:white;border:1px solid #dce3ea;border-radius:10px;padding:16px;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #bbc8d2;border-radius:7px;box-sizing:border-box}input,textarea{max-width:100%}button{cursor:pointer;background:#eaf1f7}button.primary{background:#176b8c;color:white;border-color:#176b8c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}label{display:flex;flex-direction:column;gap:5px;font-size:13px;margin:7px 0}.muted{color:#68788a;font-size:13px}.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}.item span{flex:1}.item input{width:85px}.tabs button.active{background:#176b8c;color:white}.hidden{display:none}#status{min-height:20px;color:#176b8c}small{color:#6b7885}textarea{width:100%;min-height:90px}</style></head><body><header><h1>病傷カルテ入力 <small>試用版</small></h1></header><main><div class="panel"><div class="row"><label class="grow">GAS WebアプリURL<input id="api" placeholder="https://script.google.com/macros/s/.../exec"></label><button id="setApi">接続先を保存</button></div><small>URLはこの端末のブラウザに保存されます。個人情報を含む運用前に認証を整備してください。</small></div><div class="panel"><h3>1. 牛を検索</h3><div class="row"><input id="q" inputmode="numeric" maxlength="4" placeholder="耳標 下4桁"><button id="search" class="primary">検索</button></div><div id="cows"></div></div><div id="editor" class="hidden"><div class="panel"><h3 id="cowTitle">2. カルテ</h3><div class="row"><button id="new" class="primary">新規</button><button id="revisit">再診（未請求）</button></div><div id="episodes"></div><p id="mode" class="muted">新規か再診を選択してください</p><div class="row"><label>診療日<input type="date" id="date"></label><label>時刻<input type="time" id="time"></label><label>獣医師<input id="vet"></label><label>往診<select id="visit"><option>通常</option><option>夜間</option><option>深夜</option><option>なし</option></select></label></div><div class="row"><label>体温<input type="number" step="0.1" id="temp"></label><label>心拍数<input type="number" id="pulse"></label><label>呼吸数<input type="number" id="resp"></label></div><label>レセプト・診療記録<textarea id="note"></textarea></label></div><div class="panel"><h3>3. 処置・薬品</h3><div class="row tabs"><button id="procTab" class="active">処置</button><button id="drugTab">薬品</button><input id="itemSearch" class="grow" placeholder="名称・コードで検索"></div><div id="catalog"></div><h4>選択済み</h4><div id="selected"></div></div><div class="panel"><button id="save" class="primary">カルテを保存</button><p id="status"></p></div></div></main><script>
const $=id=>document.getElementById(id);let cow=null,episode=null,kind='処置',masters={処置:[],薬剤:[]},chosen=[];const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('date').value=today();$('time').value=new Date().toTimeString().slice(0,5);$('api').value=localStorage.getItem('gasUrl')||'';$('vet').value=localStorage.getItem('vet')||'';$('setApi').onclick=()=>{localStorage.setItem('gasUrl',$('api').value.trim());alert('保存しました')};function msg(s){$('status').textContent=s}async function request(action,data={}){let url=$('api').value.trim();if(!url)throw Error('GAS URLを入力してください');let res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});let obj=await res.json();if(!obj.ok)throw Error(obj.error||'通信エラー');return obj.data}function node(tag,text){let e=document.createElement(tag);e.textContent=String(text??'');return e}function clear(id){$(id).replaceChildren()}$('search').onclick=async()=>{try{let q=$('q').value.trim();if(!/^\d{4}$/.test(q))throw Error('4桁の数字を入力してください');let data=await request('searchCows',{q});clear('cows');$('editor').classList.add('hidden');if(!data.length)$('cows').append(node('p','該当なし'));data.forEach(c=>{let b=node('button',`${c['耳標']} / ${c['名号']||''} / ${c['農家名']||''} / ${c['牛管理番号']}`);b.onclick=()=>selectCow(c);$('cows').append(b)})}catch(e){alert(e.message)}};async function selectCow(c){cow=c;episode=null;chosen=[];$('editor').classList.remove('hidden');$('cowTitle').textContent=`2. ${c['耳標']} ${c['名号']||''}（${c['農家名']||''}）`;$('mode').textContent='新規か再診を選択してください';clear('episodes');renderChosen();try{let d=await request('masters');masters=d;renderCatalog()}catch(e){alert(e.message)}}$('new').onclick=()=>{episode=null;$('mode').textContent='新規カルテ（保存時にカルテ番号を採番）';clear('episodes')};$('revisit').onclick=async()=>{try{let data=await request('openEpisodes',{cowId:cow['牛管理番号']});clear('episodes');if(!data.length){$('episodes').append(node('p','未請求カルテはありません'));return}data.forEach(e=>{let b=node('button',`${e['カルテ番号']} / ${e['病名']||'病名未設定'} / ${e['初診日']||''}`);b.onclick=()=>{episode=e['カルテ番号'];$('mode').textContent=`再診：カルテ番号 ${episode}`};$('episodes').append(b)})}catch(e){alert(e.message)}};function tab(k){kind=k;$('procTab').classList.toggle('active',k==='処置');$('drugTab').classList.toggle('active',k==='薬剤');renderCatalog()}$('procTab').onclick=()=>tab('処置');$('drugTab').onclick=()=>tab('薬剤');$('itemSearch').oninput=renderCatalog;function renderCatalog(){clear('catalog');let q=$('itemSearch').value.toLowerCase(),items=(masters[kind]||[]).filter(x=>!q?x.favorite:(x.name+' '+x.code).toLowerCase().includes(q)).slice(0,80);items.forEach(x=>{let div=node('div','');div.className='item';div.append(node('span',`${x.name} (${x.code}) ${x.unit||''}`));let b=node('button','追加');b.onclick=()=>{let found=chosen.find(y=>y.kind===kind&&y.code===x.code);if(found)found.qty++;else chosen.push({...x,kind,qty:1});renderChosen()};div.append(b);$('catalog').append(div)});if(!items.length)$('catalog').append(node('p','該当する項目がありません'))}function renderChosen(){clear('selected');chosen.forEach((x,i)=>{let div=node('div','');div.className='item';div.append(node('span',`${x.kind} ${x.name} / ${x.unit||'回'}`));let inp=document.createElement('input');inp.type='number';inp.min='0.01';inp.step='any';inp.value=x.qty;inp.onchange=()=>x.qty=Number(inp.value);div.append(inp);let b=node('button','削除');b.onclick=()=>{chosen.splice(i,1);renderChosen()};div.append(b);$('selected').append(div)})}$('save').onclick=async()=>{try{if(!cow)throw Error('牛を選択してください');if(episode===null&& !$('mode').textContent.startsWith('新規'))throw Error('新規または再診を選択してください');if(!chosen.length&&!$('note').value.trim())throw Error('処置・薬品または記録を入力してください');if(!confirm('カルテを保存しますか？'))return;msg('保存中...');$('save').disabled=true;localStorage.setItem('vet',$('vet').value);let data=await request('saveChart',{cowId:cow['牛管理番号'],chartNo:episode,visit:{date:$('date').value,time:$('time').value,vet:$('vet').value,visit:$('visit').value,temp:$('temp').value,pulse:$('pulse').value,resp:$('resp').value,note:$('note').value},items:chosen.map(x=>({kind:x.kind,code:x.code,qty:x.qty}))});episode=data.chartNo;$('mode').textContent=`再診：カルテ番号 ${episode}`;msg(`保存完了：${data.visitId}`);chosen=[];renderChosen()}catch(e){msg('保存失敗：'+e.message)}finally{$('save').disabled=false}};
</script></body></html>
