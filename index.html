<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>病傷カルテ入力</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#253447;margin:0}main{max-width:860px;margin:auto;padding:16px}header{background:#173d58;color:white;padding:17px}h1{font-size:20px;margin:0}.panel{background:white;border:1px solid #dce3ea;border-radius:10px;padding:16px;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #bbc8d2;border-radius:7px;box-sizing:border-box}input,textarea{max-width:100%}button{cursor:pointer;background:#eaf1f7}button.primary{background:#176b8c;color:white;border-color:#176b8c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}label{display:flex;flex-direction:column;gap:5px;font-size:13px;margin:7px 0}.muted{color:#68788a;font-size:13px}.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}.item span{flex:1}.item input{width:85px}.tabs button.active{background:#176b8c;color:white}.hidden{display:none}#status{min-height:20px;color:#176b8c}small{color:#6b7885}textarea{width:100%;min-height:90px}</style></head><body><header><h1>病傷カルテ入力 <small>試用版</small></h1></header><main><div class="panel"><div class="row"><label class="grow">GAS WebアプリURL<input id="api" placeholder="https://script.google.com/macros/s/.../exec"></label><button id="setApi">接続先を保存</button></div><small>URLはこの端末のブラウザに保存されます。個人情報を含む運用前に認証を整備してください。</small></div><div class="panel"><h3>1. 牛を検索</h3><div class="row"><input id="q" inputmode="numeric" maxlength="4" placeholder="耳標 下4桁"><button id="search" class="primary">検索</button></div><div id="cows"></div></div><div id="editor" class="hidden"><div class="panel"><h3 id="cowTitle">2. カルテ</h3><div class="row"><button id="new" class="primary">新規</button><button id="revisit">再診（未請求）</button></div><div id="episodes"></div><p id="mode" class="muted">新規か再診を選択してください</p><div class="row"><label>診療日<input type="date" id="date"></label><label>時刻<input type="time" id="time"></label><label>獣医師<input id="vet"></label><label>往診<select id="visit"><option>通常</option><option>夜間</option><option>深夜</option><option>なし</option></select></label></div><div class="row"><label>体温（℃）<span class="row"><button type="button" data-tpr="temp" data-delta="-0.1">−</button><input style="width:95px" type="number" step="0.1" id="temp"><button type="button" data-tpr="temp" data-delta="0.1">＋</button></span></label><label>心拍数<span class="row"><button type="button" data-tpr="pulse" data-delta="-4">−</button><input style="width:90px" type="number" id="pulse"><button type="button" data-tpr="pulse" data-delta="4">＋</button></span></label><label>呼吸数<span class="row"><button type="button" data-tpr="resp" data-delta="-4">−</button><input style="width:90px" type="number" id="resp"><button type="button" data-tpr="resp" data-delta="4">＋</button></span></label></div><div class="row"><label>TPR区分<select id="tprSource"><option value="未測定">未測定</option><option value="前回値からの推定">前回値からの推定</option><option value="実測">実測</option></select></label><span id="tprHint" class="muted"></span></div><div id="caseFields"><h4>症例情報（新規カルテ）</h4><div class="row"><label>発病年月日<input type="date" id="onsetDate"></label><label>第一病名<input id="diagnosis1" placeholder="病名・コードで検索" autocomplete="off"></label><label>第一病名コード<input id="diagnosisCode1" readonly></label><label>原因1<input id="cause1" placeholder="自動入力・修正可能"></label></div><div class="row"><label>第二病名<input id="diagnosis2" placeholder="病名・コードで検索" autocomplete="off"></label><label>第二病名コード<input id="diagnosisCode2" readonly></label><label>原因2<input id="cause2" placeholder="自動入力・修正可能"></label></div><div id="diagnosisChoices" class="muted"></div><label>稟告<textarea id="history" placeholder="稟告を入力"></textarea></label><small>個体責任開始日・最終分娩日・最終人工授精日・住所・往診距離はマスタから取得します。</small></div><label>レセプト・診療記録<textarea id="note"></textarea></label></div><div class="panel"><h3>3. 処置・薬品</h3><div class="row tabs"><button id="procTab" class="active">処置</button><button id="drugTab">薬品</button><input id="itemSearch" class="grow" placeholder="名称・コードで検索"></div><div id="catalog"></div><h4>選択済み</h4><div id="selected"></div></div><div class="panel"><button id="save" class="primary">カルテを保存</button><p id="status"></p></div></div></main><script>
const $=id=>document.getElementById(id);let cow=null,episode=null,kind='処置',masters={処置:[],薬剤:[],病名:[]},chosen=[],diagFocus=1;const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('date').value=today();$('onsetDate').value=today();$('time').value=new Date().toTimeString().slice(0,5);$('api').value=localStorage.getItem('gasUrl')||'';$('vet').value=localStorage.getItem('vet')||'';$('setApi').onclick=()=>{localStorage.setItem('gasUrl',$('api').value.trim());alert('保存しました')};function msg(s){$('status').textContent=s}// GAS ContentService はクロスオリジン fetch に CORS ヘッダーを付けられないため、
// 読み取りは JSONP、保存は非同期フォーム POST + iframe postMessage を使います。
function request(action,data={}){const url=$('api').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/(?:s\/|[^/]+\/s\/).+\/exec(?:\?.*)?$/.test(url))return Promise.reject(Error('正しいGAS /exec URLを入力してください'));if(action==='saveChart')return postForm(url,{action,...data});return jsonp(url,{action,...data})}
function jsonp(url,params){return new Promise((resolve,reject)=>{const cb='cattleCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let done=false;const finish=(err,obj)=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();if(err)reject(err);else if(!obj||!obj.ok)reject(Error(obj?.error||'GAS応答エラー'));else resolve(obj.data)};const timer=setTimeout(()=>finish(Error('GAS応答がありません。URL・デプロイ設定を確認してください')),20000);window[cb]=obj=>finish(null,obj);script.onerror=()=>finish(Error('GASの読み込みに失敗しました'));const u=new URL(url);u.searchParams.set('action',params.action);u.searchParams.set('callback',cb);Object.entries(params).forEach(([k,v])=>{if(k!=='action')u.searchParams.set(k,String(v))});script.src=u.href;document.head.append(script)})}
function postForm(url,params){return new Promise((resolve,reject)=>{const token='cattle_'+Date.now()+'_'+Math.random().toString(36).slice(2);const frame=document.createElement('iframe');frame.name=token;frame.style.display='none';const form=document.createElement('form');form.method='POST';form.action=url;form.target=token;form.style.display='none';const input=document.createElement('input');input.name='payload';input.value=JSON.stringify(params);form.append(input);let done=false;function finish(err,data){if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onMessage);setTimeout(()=>{form.remove();frame.remove()},100);if(err)reject(err);else resolve(data)}function onMessage(e){if(!/^https:\/\/(?:script\.google\.com|(?:[a-z0-9-]+\.)?googleusercontent\.com)$/.test(e.origin))return;const d=e.data;if(!d||d.channel!=='cattleChartSave'||d.token!==token)return;if(!d.result?.ok)finish(Error(d.result?.error||'保存失敗'));else finish(null,d.result.data)}window.addEventListener('message',onMessage);const timer=setTimeout(()=>finish(Error('保存応答がありません。再送信する前にシートを確認してください')),30000);const t=document.createElement('input');t.name='token';t.value=token;form.append(t);document.body.append(frame,form);form.submit()})}
function node(tag,text){let e=document.createElement(tag);e.textContent=String(text??'');return e}function clear(id){$(id).replaceChildren()}$('search').onclick=async()=>{try{let q=$('q').value.trim();if(!/^\d{4}$/.test(q))throw Error('4桁の数字を入力してください');let data=await request('searchCows',{q});clear('cows');$('editor').classList.add('hidden');if(!data.length)$('cows').append(node('p','該当なし'));data.forEach(c=>{let b=node('button',`${c['耳標']} / ${c['名号']||''} / ${c['農家名']||''} / ${c['牛管理番号']}`);b.onclick=()=>selectCow(c);$('cows').append(b)})}catch(e){alert(e.message)}};async function selectCow(c){cow=c;episode=null;chosen=[];$('editor').classList.remove('hidden');$('cowTitle').textContent=`2. ${c['耳標']} ${c['名号']||''}（${c['農家名']||''}）`;$('mode').textContent='新規か再診を選択してください';clear('episodes');$('caseFields').classList.remove('hidden');['history','diagnosisCode1','diagnosis1','diagnosisCode2','diagnosis2','cause1','cause2'].forEach(id=>$(id).value='');$('onsetDate').value=$('date').value;['temp','pulse','resp'].forEach(id=>$(id).value='');$('tprSource').value='未測定';$('tprHint').textContent='';renderChosen();try{let d=await request('masters');masters=d;renderCatalog();renderDiagnoses()}catch(e){alert(e.message)}}$('new').onclick=()=>{episode=null;$('mode').textContent='新規カルテ（保存時にカルテ番号を採番）';$('caseFields').classList.remove('hidden');clear('episodes');['temp','pulse','resp'].forEach(id=>$(id).value='');$('tprSource').value='未測定'};$('revisit').onclick=async()=>{try{let data=await request('openEpisodes',{cowId:cow['牛管理番号']});clear('episodes');if(!data.length){$('episodes').append(node('p','未請求カルテはありません'));return}data.forEach(e=>{let b=node('button',`${e['カルテ番号']} / ${e['病名']||'病名未設定'} / ${e['初診日']||''}`);b.onclick=()=>{episode=e['カルテ番号'];$('mode').textContent=`再診：カルテ番号 ${episode}`;$('caseFields').classList.add('hidden');loadPreviousTpr(episode)};$('episodes').append(b)})}catch(e){alert(e.message)}};function tab(k){kind=k;$('procTab').classList.toggle('active',k==='処置');$('drugTab').classList.toggle('active',k==='薬剤');renderCatalog()}$('procTab').onclick=()=>tab('処置');$('drugTab').onclick=()=>tab('薬剤');$('itemSearch').oninput=renderCatalog;function renderCatalog(){clear('catalog');let q=$('itemSearch').value.toLowerCase(),items=(masters[kind]||[]).filter(x=>!q?x.favorite:(x.name+' '+x.code).toLowerCase().includes(q)).slice(0,80);items.forEach(x=>{let div=node('div','');div.className='item';div.append(node('span',`${x.name} (${x.code}) ${x.unit||''}`));let b=node('button','追加');b.onclick=()=>{let found=chosen.find(y=>y.kind===kind&&y.code===x.code);if(found)found.qty++;else chosen.push({...x,kind,qty:1});renderChosen()};div.append(b);$('catalog').append(div)});if(!items.length)$('catalog').append(node('p','該当する項目がありません'))}function renderChosen(){clear('selected');chosen.forEach((x,i)=>{let div=node('div','');div.className='item';div.append(node('span',`${x.kind} ${x.name} / ${x.unit||''}`));let inp=document.createElement('input');inp.type='number';inp.min='0.01';inp.step='any';inp.value=x.qty;inp.onchange=()=>x.qty=Number(inp.value);div.append(inp);let b=node('button','削除');b.onclick=()=>{chosen.splice(i,1);renderChosen()};div.append(b);$('selected').append(div)})}$('save').onclick=async()=>{try{if(!cow)throw Error('牛を選択してください');if(episode===null&& !$('mode').textContent.startsWith('新規'))throw Error('新規または再診を選択してください');if(!chosen.length&&!$('note').value.trim())throw Error('処置・薬品または記録を入力してください');if(!confirm('カルテを保存しますか？'))return;msg('保存中...');$('save').disabled=true;localStorage.setItem('vet',$('vet').value);let data=await request('saveChart',{cowId:cow['牛管理番号'],chartNo:episode,caseInfo:{onsetDate:$('onsetDate').value,history:$('history').value,diagnosisCode1:$('diagnosisCode1').value,diagnosis1:$('diagnosis1').value,diagnosisCode2:$('diagnosisCode2').value,diagnosis2:$('diagnosis2').value,cause1:$('cause1').value,cause2:$('cause2').value},visit:{date:$('date').value,time:$('time').value,vet:$('vet').value,visit:$('visit').value,temp:$('temp').value,pulse:$('pulse').value,resp:$('resp').value,tprSource:$('tprSource').value,note:$('note').value},items:chosen.map(x=>({kind:x.kind,code:x.code,qty:x.qty}))});episode=data.chartNo;$('mode').textContent=`再診：カルテ番号 ${episode}`;msg(`保存完了：${data.visitId}`);chosen=[];renderChosen()}catch(e){msg('保存失敗：'+e.message)}finally{$('save').disabled=false}};

async function loadPreviousTpr(chartNo){try{const t=await request('previousTpr',{chartNo});if(!t)return;for(const [field,key] of [['temp','temp'],['pulse','pulse'],['resp','resp']])$(field).value=t[key]??'';$('tprSource').value='前回値からの推定';$('tprHint').textContent='前回の診療値を参照しています（今回の実測ではありません）'}catch(e){$('tprHint').textContent='前回TPRの取得失敗：'+e.message}}
document.querySelectorAll('[data-tpr]').forEach(b=>b.addEventListener('click',()=>{const x=$(b.dataset.tpr),step=Number(b.dataset.delta),n=Number(x.value||0);x.value=(Math.round((n+step)*10)/10).toFixed(b.dataset.tpr==='temp'?1:0);if($('tprSource').value==='未測定')$('tprSource').value='前回値からの推定'}));
function chooseDiagnosis(d,i){$('diagnosis'+i).value=d.name;$('diagnosisCode'+i).value=d.code;$('cause'+i).value=d.cause;renderDiagnoses()}
function renderDiagnoses(){const area=$('diagnosisChoices');area.replaceChildren();const q=$('diagnosis'+diagFocus).value.trim().toLowerCase();let ds=(masters['病名']||[]).filter(d=>q?(d.name+' '+d.code).toLowerCase().includes(q):d.favorite).slice(0,35);const label=node('p','病名'+diagFocus+'：'+(q?'検索結果':'常用病名'));area.append(label);const wrap=node('div','');wrap.className='row';ds.forEach(d=>{const b=node('button',d.name+' ('+d.code+')');b.type='button';b.onclick=()=>chooseDiagnosis(d,diagFocus);wrap.append(b)});area.append(wrap);if(!ds.length)area.append(node('small','該当する病名がありません'))}
for(const i of [1,2]){const inp=$('diagnosis'+i);inp.addEventListener('focus',()=>{diagFocus=i;renderDiagnoses()});inp.addEventListener('input',()=>{diagFocus=i;$('diagnosisCode'+i).value='';$('cause'+i).value='';renderDiagnoses()})}
</script></body></html>
